name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install fastapi uvicorn python-multipart python-dotenv pdfplumber chromadb rank_bm25 langchain-text-splitters groq pydantic pytest httpx
      - name: Run tests
        run: pytest -q